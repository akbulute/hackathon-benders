<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniGrid ERP/SCADA - Sektörel Planlama Merkezi</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        ind: {
                            base: '#121212',
                            panel: '#1e1e1e',
                            border: '#333333',
                            text: '#f4f4f5',
                            textMuted: '#a1a1aa',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #121212;
            color: #f4f4f5;
            margin: 0;
            padding: 0;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #121212;
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        .animate-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #333;
            border-bottom-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #3f3f46;
            border-radius: 3px;
        }

        input[type=datetime-local] {
            color-scheme: dark;
        }

        .gantt-bar-warning {
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            border: 2px solid #ef4444 !important;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const API_URL = "http://127.0.0.1:8000";

        // --- BİLEŞENLER ---
        const EPIASChart = ({ data }) => {
            if (!data || !data.saatler) return null;

            const maxFiyat = Math.max(...data.fiyatlar, 1);
            const maxYuk = Math.max(...(data.enerji_yuku || [0]), 1);

            return (
                <HmiPanel className="mt-2 w-full h-[220px] flex flex-col mb-12">
                    <div className="text-xs font-semibold text-ind-textMuted uppercase tracking-wider mb-4 flex justify-between">
                        <span>Saatlik Toplam Enerji Yükü (kW) ve Elektrik Fiyatı (TL/MWh)</span>
                        <div className="flex space-x-4">
                            <span className="flex items-center text-blue-400"><div className="w-2 h-2 bg-blue-500 rounded-full mr-1"></div>Fiyat Alanı</span>
                            <span className="flex items-center text-green-400"><div className="w-2 h-2 bg-green-500 rounded-full mr-1"></div>Yük Çubuğu</span>
                        </div>
                    </div>
                    <div className="flex-1 w-full relative flex items-end justify-between border-b border-ind-border pb-1">
                        {data.saatler.map((saat, i) => {
                            const fiyat = data.fiyatlar[i];
                            const yuk = data.enerji_yuku ? data.enerji_yuku[i] : 0;
                            const fiyatHeight = (fiyat / maxFiyat) * 100;
                            const yukHeight = (yuk / maxYuk) * 100;

                            return (
                                <div key={i} className="relative flex flex-col items-center justify-end h-full flex-1 group">
                                    <div className="absolute bottom-0 w-full bg-blue-500/20" style={{ height: `${fiyatHeight}%` }}></div>
                                    <div className="absolute bottom-0 w-full border-t border-blue-500" style={{ height: `${fiyatHeight}%` }}></div>
                                    <div className="relative w-1/2 bg-green-500 opacity-90 rounded-t-sm z-10 transition-all group-hover:bg-green-400" style={{ height: `${yukHeight}%` }}></div>
                                    <div className="absolute -bottom-6 text-[10px] text-ind-textMuted whitespace-nowrap overflow-hidden text-center w-full">
                                        {saat.split(':')[0]}
                                    </div>
                                    <div className="hidden group-hover:block absolute bottom-full mb-2 z-20 bg-ind-panel border border-ind-border p-3 rounded shadow-2xl text-xs whitespace-nowrap">
                                        <div className="font-bold text-white mb-1 border-b border-ind-border pb-1">{saat}</div>
                                        <div><span className="text-blue-400 font-semibold inline-block w-12">Fiyat:</span> {fiyat.toFixed(2)} TL</div>
                                        <div><span className="text-green-400 font-semibold inline-block w-12">Yük:</span> {yuk} kW</div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </HmiPanel>
            );
        };
        const HmiPanel = ({ children, className = "" }) => (
            <div className={`bg-ind-panel border border-ind-border rounded-lg p-5 shadow-lg ${className}`}>
                {children}
            </div>
        );

        const CountUp = ({ value, prefix = "", suffix = "", decimals = 0 }) => {
            const [count, setCount] = useState(0);
            useEffect(() => {
                let start = count;
                const end = parseFloat(value);
                if (isNaN(end)) return;
                const duration = 1500;
                const startTime = performance.now();

                const step = (now) => {
                    const progress = Math.min((now - startTime) / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 4); // easeOutQuart
                    setCount(start + (end - start) * ease);
                    if (progress < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }, [value]);

            return <span>{prefix}{count.toFixed(decimals)}{suffix}</span>;
        };

        const KPICard = ({ title, value, unit, icon, colorClass, decimals = 0 }) => (
            <HmiPanel className="flex-1 flex flex-col justify-center relative overflow-hidden">
                <div className={`absolute -right-4 -top-4 w-16 h-16 rounded-full opacity-10 ${colorClass}`}></div>
                <div className="flex items-center text-ind-textMuted text-xs font-semibold uppercase tracking-wider mb-2">
                    {icon && <span className="mr-2">{icon}</span>}
                    {title}
                </div>
                <div className="flex items-baseline space-x-1 z-10">
                    <span className="text-3xl font-mono font-bold text-white tracking-tight">
                        <CountUp value={value} decimals={decimals} />
                    </span>
                    <span className="text-ind-textMuted font-mono text-sm">{unit}</span>
                </div>
            </HmiPanel>
        );

        const FleetStatus = ({ machines }) => {
            const idleCount = machines.filter(m => m.status === 'BOŞTA').length;
            const activeCount = machines.filter(m => m.status === 'ÇALIŞIYOR').length;

            return (
                <HmiPanel className="flex-1">
                    <div className="text-xs font-semibold text-ind-textMuted uppercase tracking-wider mb-4 border-b border-ind-border pb-2">
                        Sektörel Filo Durumu
                    </div>
                    <div className="flex justify-between items-center mb-4">
                        <div className="text-center">
                            <div className="text-2xl font-mono font-bold text-green-400">{idleCount}</div>
                            <div className="text-[10px] text-ind-textMuted uppercase">Boşta</div>
                        </div>
                        <div className="text-center">
                            <div className="text-2xl font-mono font-bold text-blue-400">{activeCount}</div>
                            <div className="text-[10px] text-ind-textMuted uppercase">Çalışıyor</div>
                        </div>
                        <div className="text-center">
                            <div className="text-2xl font-mono font-bold text-ind-text">{machines.length}</div>
                            <div className="text-[10px] text-ind-textMuted uppercase">Toplam</div>
                        </div>
                    </div>
                </HmiPanel>
            );
        };

        const GanttChart = ({ machines, orderDeadlineStr }) => {
            // Deadline'dan saat farkını (relative hour) hesapla
            let deadlineHour = 24;
            if (orderDeadlineStr) {
                const dt = new Date(orderDeadlineStr);
                const now = new Date();
                const diffHours = Math.max(1, Math.ceil((dt - now) / (1000 * 60 * 60)));
                if (!isNaN(diffHours)) deadlineHour = diffHours;
            }

            // Çizelgedeki en geç biten işin saatini bul (veya deadline)
            let maxTaskEnd = deadlineHour;
            machines.forEach(row => {
                if (row.tasks) {
                    row.tasks.forEach(t => { if (t.end > maxTaskEnd) maxTaskEnd = t.end; });
                }
            });

            // X eksenini oluşturmak için toplam saat ufkunu belirle (24'ün en az bir katı veya esnek)
            // Daha rahat görünüm için sona 4 saat boşluk payı ekle, 6'nın katına yuvarla.
            const totalHours = Math.max(24, Math.ceil((maxTaskEnd + 4) / 12) * 12);

            return (
                <HmiPanel className="flex-1 flex flex-col min-h-[350px]">
                    <div className="flex justify-between items-center mb-4 border-b border-ind-border pb-3">
                        <h3 className="text-sm font-sans font-semibold uppercase tracking-wider text-white flex items-center">
                            Sektörel İş Emri Çizelgesi (Gantt)
                            {orderDeadlineStr && (
                                <span className="ml-4 text-[10px] bg-ind-border px-2 py-1 rounded text-ind-textMuted font-mono">
                                    Son Teslim: {deadlineHour}:00
                                </span>
                            )}
                        </h3>
                        <div className="flex space-x-4 text-[11px] font-sans text-ind-textMuted">
                            <div className="flex items-center"><span className="w-3 h-3 bg-green-500 rounded-sm mr-2"></span>Ucuz Saat</div>
                            <div className="flex items-center"><span className="w-3 h-3 bg-red-500 rounded-sm mr-2"></span>Pahalı Saat</div>
                            <div className="flex items-center"><span className="w-3 h-3 bg-blue-500 rounded-sm mr-2"></span>Normal Saat</div>
                            <div className="flex items-center"><span className="w-3 h-3 border-2 border-red-500 rounded-sm mr-2"></span>Gecikme Uyarısı</div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col justify-around relative">
                        {/* Arka plan ızgara */}
                        <div className="absolute inset-0 left-[220px] right-0 pointer-events-none z-0 flex justify-between">
                            {[...Array(totalHours + 1)].map((_, i) => (
                                <div key={i} className={`h-full border-l ${i === deadlineHour && orderDeadlineStr ? 'border-red-500 border-2 z-20' : 'border-ind-border border-dashed opacity-30'}`}></div>
                            ))}
                        </div>

                        {machines.length === 0 ? (
                            <div className="text-center text-ind-textMuted py-10 font-mono">Bu sektörde aktif makine bulunmuyor.</div>
                        ) : machines.map(row => {
                            // Makinenin herhangi bir işi deadline'ı aşıyor mu?
                            const hasDelay = row.tasks && row.tasks.some(t => t.end > deadlineHour);

                            return (
                                <div key={row.id} className={`flex items-center z-10 my-2 ${hasDelay ? 'bg-red-900/10 rounded pr-2' : ''}`}>
                                    <div className="w-[220px] pr-4 shrink-0 flex items-center">
                                        {hasDelay && <span className="text-red-500 mr-2 animate-pulse" title="Gecikme Riski!">⚠️</span>}
                                        <div>
                                            <div className={`text-xs font-mono font-medium truncate ${hasDelay ? 'text-red-400' : 'text-white'}`} title={row.name}>{row.name}</div>
                                            <div className={`text-[10px] font-mono mt-1 ${row.status === 'BOŞTA' ? 'text-green-500' : (hasDelay ? 'text-red-500' : 'text-blue-400')}`}>
                                                {row.status} {hasDelay && "(GECİKME)"}
                                            </div>
                                        </div>
                                    </div>

                                    <div className={`flex-1 relative h-8 bg-ind-base rounded overflow-hidden border ${hasDelay ? 'border-red-800' : 'border-ind-border'} shadow-inner`}>
                                        {row.tasks && row.tasks.length > 0 ? row.tasks.map((task, i) => {
                                            let bgColor = 'bg-blue-500';
                                            if (task.type === 'pahali_saat' || task.type === 'pahali') bgColor = 'bg-red-500';
                                            if (task.type === 'ucuz_saat' || task.type === 'ucuz') bgColor = 'bg-green-500';

                                            const isLate = task.end > deadlineHour;

                                            return (
                                                <div key={i}
                                                    className={`absolute top-0 bottom-0 ${bgColor} flex items-center justify-center rounded-sm transition-opacity cursor-pointer ${isLate ? 'gantt-bar-warning opacity-100' : 'opacity-90 hover:opacity-100'}`}
                                                    style={{ left: `${(task.start / totalHours) * 100}%`, width: `${((task.end - task.start) / totalHours) * 100}%` }}
                                                    title={`Süre: +${task.start}sa - +${task.end}sa`}
                                                >
                                                    <span className="px-1 text-[10px] font-mono font-bold text-white whitespace-nowrap overflow-hidden shadow-sm">
                                                        +{task.start} - +{task.end}
                                                    </span>
                                                </div>
                                            );
                                        }) : (
                                            <div className="w-full h-full flex items-center justify-center text-[10px] text-ind-textMuted opacity-30 font-mono">
                                                BOŞTA
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="flex mt-2">
                        <div className="w-[220px] shrink-0"></div>
                        <div className="flex-1 flex justify-between text-[10px] text-ind-textMuted font-mono">
                            {[...Array(totalHours + 1)].map((_, h) => {
                                // Ekran çok sıkışmasın diye atlama yap
                                if (totalHours <= 24 && h % 4 !== 0) return null;
                                if (totalHours > 24 && totalHours <= 48 && h % 6 !== 0) return null;
                                if (totalHours > 48 && h % 12 !== 0) return null;

                                const day = Math.floor(h / 24);
                                const hour = h % 24;
                                const hourStr = String(hour).padStart(2, '0') + ':00';

                                return (
                                    <span key={h} className="text-center relative whitespace-nowrap">
                                        <div className="absolute -top-2 left-1/2 -translate-x-1/2 h-1 w-px bg-ind-border"></div>
                                        {day > 0 ? <span className="text-blue-400 font-bold">+{day}G </span> : ""}
                                        {hourStr}
                                    </span>
                                );
                            })}
                        </div>
                    </div>
                </HmiPanel>
            );
        };

        const OrderPanel = ({ activeSector, onOptimize, isOptimizing }) => {
            const [deadline, setDeadline] = useState("");
            const [speed, setSpeed] = useState(1);
            const [adet, setAdet] = useState(1);

            useEffect(() => {
                // Varsayılan olarak yarına set edelim
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                tomorrow.setHours(15, 0, 0, 0);

                const pad = (n) => String(n).padStart(2, '0');
                const isoStr = `${tomorrow.getFullYear()}-${pad(tomorrow.getMonth() + 1)}-${pad(tomorrow.getDate())}T${pad(tomorrow.getHours())}:${pad(tomorrow.getMinutes())}`;
                setDeadline(isoStr);
            }, []);

            const getSpeedLabel = (val) => {
                if (val === 1) return "1x (Normal - Maksimum Tasarruf)";
                if (val === 1.5) return "1.5x (Hızlı Üretim)";
                if (val === 2) return "2x (Acil - Minimum Tasarruf)";
                return "";
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!deadline) return alert("Lütfen bir tarih ve saat seçin.");

                // ISO string'e dönüştür ve gönder
                const isoDeadline = new Date(deadline).toISOString();
                onOptimize({ sector: activeSector, deadline: isoDeadline, speed, adet: parseInt(adet) });
            };

            return (
                <HmiPanel className="w-[350px] flex flex-col shrink-0 ml-6 bg-gradient-to-b from-ind-panel to-[#18181b] border-ind-border/80">
                    <div className="flex items-center mb-6 border-b border-ind-border pb-3">
                        <div className="w-8 h-8 rounded bg-blue-500/20 text-blue-400 flex items-center justify-center mr-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        </div>
                        <h2 className="text-sm font-bold uppercase tracking-wider text-white">Yeni Ürün Ekle</h2>
                    </div>

                    <form onSubmit={handleSubmit} className="flex-1 flex flex-col space-y-6">
                        {/* Ürün Tipi / Sektör (Readonly - Seçili Sekmeden Gelir) */}
                        <div>
                            <label className="block text-xs font-medium text-ind-textMuted uppercase mb-2">Hedef Sektör</label>
                            <div className="w-full bg-ind-base border border-ind-border rounded px-3 py-2.5 text-sm text-ind-accent font-semibold flex items-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" className="mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                                {activeSector}
                            </div>
                            <p className="text-[10px] text-ind-textMuted mt-1">Bu sektördeki tüm aktif makinelere iş emri dağıtılacaktır.</p>
                        </div>

                        {/* Deadline (Datetime Picker) */}
                        <div>
                            <label className="block text-xs font-medium text-ind-textMuted uppercase mb-2">Hedef Bitiş Tarihi ve Saati</label>
                            <input
                                type="datetime-local"
                                value={deadline}
                                onChange={(e) => setDeadline(e.target.value)}
                                className="w-full bg-ind-base border border-ind-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 font-mono"
                            />
                        </div>

                        {/* Hızlanma Oranı */}
                        <div className="bg-blue-900/10 border border-blue-900/30 p-4 rounded-md">
                            <label className="flex justify-between text-xs font-medium text-ind-textMuted uppercase mb-3">
                                <span>Hızlanma Oranı</span>
                                <span className={`font-mono font-bold ${speed === 2 ? 'text-red-400' : speed === 1.5 ? 'text-orange-400' : 'text-green-400'}`}>
                                    {speed}x
                                </span>
                            </label>
                            <input
                                type="range" min="1" max="2" step="0.5"
                                value={speed}
                                onChange={(e) => setSpeed(parseFloat(e.target.value))}
                            />
                            <div className="text-center text-[11px] font-mono text-ind-textMuted mt-3 font-medium bg-ind-base py-1 rounded border border-ind-border">
                                {getSpeedLabel(speed)}
                            </div>
                        </div>

                        {/* Üretim Adedi (Batch) */}
                        <div>
                            <label className="block text-xs font-medium text-ind-textMuted uppercase mb-2">Üretim Adedi (Parti)</label>
                            <input
                                type="number"
                                min="1" max="10"
                                value={adet}
                                onChange={(e) => setAdet(e.target.value)}
                                className="w-full bg-ind-base border border-ind-border rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 font-mono"
                            />
                        </div>

                        <div className="flex-1"></div>

                        <button
                            type="submit"
                            disabled={isOptimizing}
                            className={`w-full py-4 rounded font-bold text-xs uppercase tracking-widest transition-all
                                ${isOptimizing ? 'bg-ind-border text-ind-textMuted cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/20 active:scale-95'}`}
                        >
                            {isOptimizing ? 'Optimizasyon Bekleniyor...' : 'Optimizasyonu Başlat'}
                        </button>
                    </form>
                </HmiPanel>
            );
        };

        // --- ANA UYGULAMA ---
        const App = () => {
            const [allMachines, setAllMachines] = useState([]);
            const [sectors, setSectors] = useState([]);
            const [activeSector, setActiveSector] = useState("");
            const [isLoading, setIsLoading] = useState(true);
            const [isOptimizing, setIsOptimizing] = useState(false);

            // Sipariş/Optimizasyon durumu
            const [activeOrder, setActiveOrder] = useState(null);
            // activeOrder = { sector, deadlineStr, speed, kpiData, ganttData }

            useEffect(() => {
                fetch(`${API_URL}/makineler`)
                    .then(res => res.json())
                    .then(data => {
                        const m = data.makineler || [];
                        setAllMachines(m);

                        // İstenen 3 ana sektörü manuel de sıralayabiliriz veya dinamik çekeriz
                        // Mümkünse sabit sırayla gösterelim
                        const predefSectors = ["Defense Industry", "Automotive Industry", "Metallurgy & Steel Industry"];
                        const existingSectors = [...new Set(m.map(x => x.sektor))].filter(Boolean);

                        // Sadece elimizde olanları göster
                        const finalSectors = predefSectors.filter(s => existingSectors.includes(s));
                        if (finalSectors.length === 0) finalSectors.push(...existingSectors);

                        setSectors(finalSectors);
                        if (finalSectors.length > 0) setActiveSector(finalSectors[0]);
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error("Makineler yüklenemedi", err);
                        setIsLoading(false);
                    });
            }, []);

            const handleOrderOptimize = async ({ sector, deadline, speed, adet }) => {
                setIsOptimizing(true);
                try {
                    // API'ye POST isteği at
                    const res = await fetch(`${API_URL}/optimize`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sektor: sector,
                            deadline: deadline,
                            hizlanma_orani: speed,
                            adet: adet
                        })
                    });

                    const data = await res.json();

                    if (!res.ok || data.durum === "HATA") {
                        alert("Optimizasyon Hatası: " + (data.mesaj || "Bilinmeyen hata"));
                        setIsOptimizing(false);
                        return;
                    }

                    // Demo Efekti: Yapay zeka düşünüyor...
                    setTimeout(() => {
                        setActiveOrder({
                            sector,
                            deadlineStr: deadline,
                            speed,
                            kpiData: data.kpi_verileri,
                            ganttData: data.gantt_cizelgesi,
                            epiasData: data.epias_grafigi
                        });
                        setIsOptimizing(false);
                    }, 1500);

                } catch (e) {
                    console.error("Optimize hatası:", e);
                    alert("Backend bağlantı hatası!");
                    setIsOptimizing(false);
                }
            };

            // Loading Ekranı
            if (isLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center">
                        <span className="loader mb-4"></span>
                        <div className="font-mono text-sm tracking-widest text-ind-textMuted animate-pulse">SİSTEM BAŞLATILIYOR...</div>
                    </div>
                );
            }

            const showOverlay = isOptimizing;

            // --- Arayüz İçin Veri Hazırlığı ---
            let displayCost = 0;
            let displaySavings = 0;
            let activeGanttMachines = [];

            // Sadece Aktif Sekmedeki (Sektör) makineleri al
            const sectorMachines = allMachines.filter(m => m.sektor === activeSector);

            if (!activeOrder || activeOrder.sector !== activeSector) {
                // Bu sekme için sipariş yok, tüm makineler BOŞTA
                activeGanttMachines = sectorMachines.map(m => ({
                    ...m, name: m.makine_adi, status: 'BOŞTA', tasks: []
                }));
            } else {
                // Sipariş verilmiş durum (bu sekme için)
                const { kpiData, ganttData } = activeOrder;
                // Önce bu sektöre ait tüm makineleri temel al (Arızalı ve Boştakiler kaybolmasın)
                const groupedGantt = {};
                sectorMachines.forEach(m => {
                    groupedGantt[m.id] = {
                        id: m.id,
                        name: m.makine_adi,
                        status: 'BOŞTA',
                        tasks: [],
                        isBroken: false
                    };
                });

                // Bakımda olan (Arıza riski taşıyan) makineleri API'den (kpiData.bakim_uyarisi) işaretle
                if (kpiData && kpiData.bakim_uyarisi) {
                    kpiData.bakim_uyarisi.forEach(bakim => {
                        if (groupedGantt[bakim.makine_id]) {
                            groupedGantt[bakim.makine_id].status = 'ARIZALI / BAKIMDA';
                            groupedGantt[bakim.makine_id].isBroken = true;
                        }
                    });
                }

                // Optimizasyon sonucu atanan işleri (Batch'leri) ana makine ID'sine göre grupla
                ganttData.filter(g => g.sektor === activeSector).forEach(scheduleItem => {
                    const baseId = scheduleItem.makine_id.split('_B')[0];
                    if (!groupedGantt[baseId]) {
                        const baseName = scheduleItem.makine_adi.replace(/\s*\(B\d+\)$/, '');
                        groupedGantt[baseId] = { id: baseId, name: baseName, tasks: [], status: 'ÇALIŞIYOR', isBroken: false };
                    }

                    if (scheduleItem.isler && scheduleItem.isler.length > 0) {
                        const newTasks = scheduleItem.isler.map(is => {
                            let start = parseInt(is.baslama_saati.split(':')[0]);
                            let end = parseInt(is.bitis_saati.split(':')[0]);
                            return { start, end, type: is.enerji_durumu };
                        });
                        groupedGantt[baseId].tasks.push(...newTasks);
                        // Eğer işi varsa ve arızalı değilse durumunu güncelliyoruz
                        if (!groupedGantt[baseId].isBroken) {
                            groupedGantt[baseId].status = 'ÇALIŞIYOR';
                        }
                    }
                });

                activeGanttMachines = Object.values(groupedGantt);

                // KPI Verileri (Dinamik Tasarruf ve Maliyet düşüşü API'den hesaplanıp geliyor)
                displayCost = kpiData.gunluk_maliyet_tl;
                displaySavings = kpiData.tasarruf_orani_yuzde;

                // Ekstra Trade-off efekti (Eğer API'den dönen tasarruf yeterince düşmemişse Frontend zorlasın diye bir fallback)
                // Tasarruf oranını animasyonlu göstermek için direkt atıyoruz, CountUp bunu halledecek.
            }

            return (
                <div className="min-h-screen flex flex-col relative">

                    {showOverlay && (
                        <div className="absolute inset-0 bg-black/80 z-50 flex flex-col items-center justify-center backdrop-blur-sm">
                            <span className="loader mb-6 w-16 h-16 border-[6px]"></span>
                            <div className="font-mono text-xl tracking-widest text-white animate-pulse">ENERJİ ÇİZELGESİ OLUŞTURULUYOR...</div>
                            <div className="text-ind-textMuted mt-2 font-mono text-sm">Lütfen Bekleyiniz...</div>
                        </div>
                    )}

                    <header className="h-16 border-b border-ind-border bg-ind-panel flex items-center justify-between px-6 shrink-0">
                        <div className="flex items-center">
                            <h1 className="text-lg font-sans font-bold tracking-widest text-white uppercase">
                                SPM <span className="text-ind-textMuted font-mono ml-2 font-normal text-xs">Sektörel Planlama Merkezi</span>
                            </h1>
                        </div>
                    </header>

                    {/* Sektörel Sekmeler (Tabbed Navigation) */}
                    <div className="px-6 pt-6 bg-ind-base shrink-0">
                        <div className="flex space-x-1 border-b border-ind-border">
                            {sectors.map(sector => (
                                <button
                                    key={sector}
                                    onClick={() => setActiveSector(sector)}
                                    className={`px-6 py-3 text-xs font-bold uppercase tracking-widest transition-colors flex items-center
                                        ${activeSector === sector
                                            ? 'border-b-2 border-blue-500 text-blue-400 bg-ind-panel'
                                            : 'text-ind-textMuted hover:text-white hover:bg-ind-panel/50'}`}
                                >
                                    {sector}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="flex-1 flex p-6 overflow-hidden">

                        <div className="flex-1 flex flex-col overflow-y-auto pr-2 space-y-6">
                            <div className="flex gap-6">
                                <KPICard
                                    title="Sektör Enerji Maliyeti"
                                    value={displayCost}
                                    unit="₺"
                                    colorClass="bg-red-500"
                                    decimals={2}
                                    icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></svg>}
                                />
                                <KPICard
                                    title="Optimizasyon Tasarrufu"
                                    value={displaySavings}
                                    unit="%"
                                    colorClass="bg-green-500"
                                    decimals={1}
                                    icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>}
                                />
                                <FleetStatus machines={activeGanttMachines} />
                            </div>

                            <GanttChart
                                machines={activeGanttMachines}
                                orderDeadlineStr={activeOrder && activeOrder.sector === activeSector ? activeOrder.deadlineStr : null}
                            />
                        </div>

                        <OrderPanel
                            activeSector={activeSector}
                            onOptimize={handleOrderOptimize}
                            isOptimizing={isOptimizing}
                        />
                    </main>

                    {/* Alt Kısım - EPİAŞ Grafiği */}
                    <div className="px-6 pb-6 w-full shrink-0">
                        <EPIASChart data={activeOrder ? activeOrder.epiasData : null} />
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
